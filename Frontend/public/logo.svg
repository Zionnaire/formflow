<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0A868"/>
      <stop offset="100%" stop-color="#D9542F"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2603A"/>
      <stop offset="100%" stop-color="#B8421F"/>
    </linearGradient>
  </defs>

  <!-- Icon badge -->
  <rect x="20" y="20" width="160" height="160" rx="40" fill="url(#badgeGrad)"/>

  <!-- Document -->
  <path d="M60 52
           a10 10 0 0 1 10 -10
           h48
           l22 22
           v96
           a10 10 0 0 1 -10 10
           h-60
           a10 10 0 0 1 -10 -10
           z"
        fill="#FDF6EE"/>

  <!-- Folded corner -->
  <path d="M118 42 L140 64 L124 64 a6 6 0 0 1 -6 -6 Z" fill="#F3D9BE"/>

  <!-- Text lines that flow into a check -->
  <rect x="76" y="82" width="56" height="7" rx="3.5" fill="#C97A4A"/>
  <rect x="76" y="102" width="46" height="7" rx="3.5" fill="#C97A4A"/>
  <path d="M76 124 h30 l8 10 l18 -22"
        fill="none" stroke="#D9542F" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accent check badge -->
  <circle cx="150" cy="150" r="24" fill="url(#checkGrad)" stroke="#FDF6EE" stroke-width="4"/>
  <path d="M139 150 l8 8 l16 -18" fill="none" stroke="#FDF6EE"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="205" y="115" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="62" font-weight="700" fill="#4A2E22">Form<tspan fill="#D9542F">Flow</tspan></text>
  <text x="207" y="145" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="19" font-weight="500" fill="#A8836C" letter-spacing="0.5">
    Paperwork, sorted with care.
  </text>
</svg>
